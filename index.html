<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snoopy World</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* 전체 분위기를 따뜻하고 귀여운 스누피 만화 톤으로 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fffdf9; /* 따뜻한 아이보리색 바탕 */
            color: #1a1a1a;
            font-family: 'Gaegu', cursive;
            font-size: 22px;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 40px; /* 위에서 아래로 흐르는 스크롤 형식 */
        }

        /* [메인 프로필] 스누피와 증명사진이 함께 있는 공간 */
        .main-profile {
            background: #ffffff;
            border: 4px solid #1a1a1a;
            border-radius: 30px;
            padding: 35px;
            box-shadow: 8px 8px 0px #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            position: relative;
        }

        /* 요청하신 크기로 앙증맞게 줄인 귀여운 증명사진 프레임 */
        .my-photo {
            width: 110px;
            height: 140px;
            border: 3px solid #1a1a1a;
            border-radius: 12px;
            padding: 6px;
            background: #fff;
            transform: rotate(-4deg); /* 살짝 삐딱하게 해서 귀여움 추가 */
            box-shadow: 4px 4px 0px #e63946;
            flex-shrink: 0;
        }

        .my-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }
